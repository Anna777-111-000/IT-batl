<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ИТ-баттлы{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1.5rem;
      background: #0d1117;
      color: #e6edf3;
      line-height: 1.5;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3 { margin-top: 0; }
    .container { max-width: 1100px; margin: 0 auto; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      margin: .75rem 0;
    }
    button, .btn {
      display: inline-block;
      background: #238636;
      color: #fff;
      border: 0;
      padding: .6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover, .btn:hover { background: #2ea043; text-decoration: none; }
    button:disabled { background: #484f58; cursor: not-allowed; }
    pre {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: .75rem;
      border-radius: 6px;
      overflow-x: auto;
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: .85rem;
    }
    textarea, select, input[type=text] {
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: .5rem;
      font-family: inherit;
      font-size: 1rem;
    }
    textarea { font-family: 'Consolas', 'Fira Code', monospace; }
    .muted { color: #8b949e; font-size: .9rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
