<style>
  {{ pygments_css|safe }}
  .highlight {
    background: #0d1117 !important;
    padding: 1rem;
    border-radius: 6px;
    border: 1px solid #30363d;
    overflow-x: auto;
    font-family: 'Consolas', 'Fira Code', monospace;
    font-size: 0.9rem;
  }
  .result-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .votes-badge {
    background: #1f6feb;
    color: white;
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-weight: bold;
    font-size: 1.1rem;
  }
</style>

{% for sub in rendered_submissions %}
  <div class="result-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h2 style="margin: 0;">👥 {{ sub.team_name }}</h2>
      <span class="votes-badge">{{ sub.votes_count }} голос(ов)</span>
    </div>
    {{ sub.code_html|safe }}
  </div>
{% empty %}
  <div class="card" style="text-align:center; padding: 3rem;">
    <h2>Пока нет присланных решений</h2>
    <p class="muted">Ожидаем участников...</p>
  </div>
{% endfor %}
